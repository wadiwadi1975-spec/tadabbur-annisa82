<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أفلا يتدبرون القرآن — الرئيسية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf7f0; --card:#ffffff; --ink:#2b2620; --muted:#6b6255; --line:#e7ddc9;
  --gold:#9c7a2e; --gold-soft:#f3e9d2; --accent:#6d5b8a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1b1812;--card:#242018;--ink:#eee6d6;--muted:#a89b83;--line:#39331f;--gold:#d9b45a;--gold-soft:#3a3120;--accent:#b9a6e0;}
}
:root[data-theme="dark"]{--bg:#1b1812;--card:#242018;--ink:#eee6d6;--muted:#a89b83;--line:#39331f;--gold:#d9b45a;--gold-soft:#3a3120;--accent:#b9a6e0;}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg) url('/الرئيسية.png') no-repeat center center fixed;background-size:cover;color:var(--ink);font-family:'Tajawal',sans-serif;line-height:1.9;}
.wrap{background:rgba(250,247,240,.92);max-width:100%;margin:0 auto;padding:32px 24px 60px;border-radius:18px;}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1b1812;--card:#242018;--ink:#eee6d6;--muted:#a89b83;--line:#39331f;--gold:#d9b45a;--gold-soft:#3a3120;--accent:#b9a6e0;}
  .wrap{background:rgba(27,24,18,.92);}
}
:root[data-theme="dark"]{--bg:#1b1812;--card:#242018;--ink:#eee6d6;--muted:#a89b83;--line:#39331f;--gold:#d9b45a;--gold-soft:#3a3120;--accent:#b9a6e0;}
:root[data-theme="dark"] .wrap{background:rgba(27,24,18,.92);}
.eyebrow{color:var(--muted);font-size:1rem;text-align:center;font-weight:700;letter-spacing:1px;}
.ayah{font-family:'Amiri',serif;font-size:2.2rem;text-align:center;margin:14px 0 22px;color:var(--gold);font-weight:700;}
.ayah span{cursor:pointer;border-radius:8px;padding:2px 4px;font-weight:700;}
.ayah span:hover{background:var(--gold-soft);}
.actions{display:flex;justify-content:center;gap:16px;font-size:1rem;color:var(--ink);margin-bottom:24px;flex-wrap:wrap;font-weight:700;}
.tabs{display:flex;overflow-x:auto;gap:10px;padding-bottom:12px;margin-bottom:20px;border-bottom:2px solid var(--gold);}
.tab{flex:none;background:none;border:2px solid var(--gold);color:var(--gold);padding:12px 20px;border-radius:24px;font-family:inherit;font-size:1rem;cursor:pointer;white-space:nowrap;font-weight:700;transition:.2s;}
.tab:hover{border-color:var(--gold);color:var(--ink);background:var(--gold-soft);}
.tab.active{background:var(--gold);border-color:var(--gold);color:#1b1812;font-weight:800;font-size:1.05rem;}
.panel{display:none;background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:24px 24px;margin-bottom:16px;}
.panel.active{display:block;}
.panel h3{margin-top:0;color:var(--gold);font-size:1.3rem;font-weight:800;}
.tag{display:inline-block;font-size:.72rem;padding:2px 9px;border-radius:10px;margin-inline-end:6px;margin-bottom:6px;}
.tag.fact{background:#dcefe0;color:#1c6b34;}
.tag.study{background:#dbe7f7;color:#1e5397;}
.tag.reading{background:#faf0c8;color:#8a6d16;}
.tag.infer{background:#f6ddc6;color:#a15a1c;}
.tag.reflect{background:#ece0f7;color:#5f3d90;}
:root[data-theme="dark"] .tag,:root:not([data-theme="light"]) .tag{filter:brightness(1.15) saturate(.9);}
.q{margin:8px 0;padding-inline-start:14px;border-inline-start:3px solid var(--accent);color:var(--muted);}
.divider{margin:16px 0;border:none;border-top:1px dashed var(--line);}
details{border:2px solid var(--gold);border-radius:14px;padding:12px 16px;margin-bottom:12px;background:var(--bg);font-weight:600;}
details summary{cursor:pointer;font-weight:800;color:var(--gold);font-size:1.05rem;}
details p{margin:8px 0 4px;}
.group-label{color:var(--ink);font-size:.9rem;margin:18px 0 8px;font-weight:800;}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;background:var(--bg);color:var(--ink);resize:vertical;}
button.primary{background:var(--gold);color:#1b1812;border:none;padding:9px 18px;border-radius:8px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:8px;}
.saved-note{background:var(--gold-soft);border-radius:10px;padding:10px 14px;margin-top:10px;font-size:.85rem;}
.hint{color:var(--muted);font-size:.85rem;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">سورة النساء — الآية ٨٢</div>
  <div class="ayah" id="ayahText">
    <span data-word="افلا">أَفَلَا</span> <span data-word="يتدبرون">يَتَدَبَّرُونَ</span> <span data-word="القران">الْقُرْآنَ</span> ۚ
    <span data-word="ولو">وَلَوْ</span> <span data-word="كان">كَانَ</span> <span data-word="من">مِنْ</span> <span data-word="عند">عِندِ</span>
    <span data-word="غير">غَيْرِ</span> <span data-word="الله">اللَّهِ</span> <span data-word="لوجدوا">لَوَجَدُوا</span>
    <span data-word="فيه">فِيهِ</span> <span data-word="اختلافا">اخْتِلَافًا</span> <span data-word="كثيرا">كَثِيرًا</span>
  </div>
  <div class="actions"><span>🔊 استماع</span><span>🔖 حفظ</span><span>↗ مشاركة</span></div>

  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script>
const sections = [
  {id:"words", label:"الكلمات", title:"يَتَدَبَّرُونَ", html:`
    <p><b>الجذر:</b> د ب ر &nbsp; <b>الوزن:</b> تَفَعَّلَ</p>
    <span class="tag study">تحليل لغوي موثق</span>
    <p>النظر في عاقبة الأمر وما وراءه، والتفكر فيه لا مجرد المرور عليه.</p>
    <div class="q">ما الفرق بين «التدبر» وبين مجرد القراءة أو السماع؟</div>
    <span class="tag reflect">سؤال مفتوح</span>
    <p class="hint">اضغط على أي كلمة في الآية أعلاه لعرض بطاقتها.</p>
  `},
  {id:"grammar", label:"الإعراب", title:"بناء الجملة", html:`
    <p><b>يَتَدَبَّرُونَ:</b> فعل مضارع مرفوع، والواو فاعل — <b>الْقُرْآنَ:</b> مفعول به — <b>لَوَجَدُوا:</b> جواب الشرط — <b>اخْتِلَافًا:</b> مفعول به، <b>كَثِيرًا:</b> صفة له.</p>
    <span class="tag study">إعراب منقول</span>
    <hr class="divider">
    <div class="q">ماذا أضافت صيغة الاستفهام «أفلا» بدل «لا يتدبرون» المجردة؟</div>
  `},
  {id:"context", label:"السياق", title:"ثلاثة مستويات", html:`
    <p><b>قريب:</b> تأتي بعد الحديث عمن يُظهرون الطاعة ثم يُبيّت فريق منهم غيرها.</p>
    <p><b>السورة:</b> جزء من خطاب أوسع حول النفاق وصدق القول.</p>
    <p><b>القرآن كله:</b> آيات أخرى تدعو للتفكر والتعقل والتفقه.</p>
    <div class="q">هل لانتقال الآية من فضح الاختلاف بين الظاهر والباطن إلى الدعوة لتدبر القرآن علاقة مقصودة؟</div>
  `},
  {id:"links", label:"الترابط", title:"جذر «تدبّر» في القرآن", html:`
    <p>ورد فعل التدبر بصيغة الاستفهام الإنكاري في القرآن في ثلاثة مواضع فقط:</p>
    <p>• <b>النساء ٨٢</b> — «أفلا يتدبرون القرآن ۚ ولو كان من عند غير الله لوجدوا فيه اختلافًا كثيرًا» — الاستدلال بالاتساق الداخلي.</p>
    <p>• <b>محمد ٢٤</b> — «أفلا يتدبرون القرآن أم على قلوب أقفالها» — ربط غياب التدبر بانغلاق القلب.</p>
    <p>• <b>المؤمنون ٦٨</b> — «أفلم يدّبروا القول» — إنكار عدم تدبرهم للقول الذي جاءهم.</p>
    <p>وفي <b>ص ٢٩</b> يرد الأمر بصيغة الغاية لا الإنكار: «كتاب أنزلناه إليك مبارك ليدبروا آياته».</p>
    <span class="tag fact">مواضع الجذر في القرآن — نص</span>
    <div class="q">لماذا يقرن القرآن التدبر مرتين بصيغة الإنكار («أفلا») ومرة بانغلاق القلب («أقفالها»)؟</div>
    <hr class="divider">
    <p class="hint">مقارنة القصص المتكررة عبر السور (ما ذُكر / لم يُذكر / تغيّر) ستُبنى لاحقًا لكل قصة على حدة — هذه الآية لا تتضمن قصة.</p>
  `},
  {id:"tafsir", label:"التفسير", title:"الطبري — ابن كثير — القرطبي", html:`
    <p><b>الطبري:</b> يربط التدبر باتساق معاني القرآن وائتلاف أحكامه وتصديق بعضه بعضًا.</p>
    <p><b>ابن كثير:</b> يفسر «الاختلاف» بالاضطراب والتضاد والتعارض المنفيّين عن القرآن.</p>
    <p><b>القرطبي:</b> يوسّع معنى التدبر إلى التفكر في المعاني والعواقب، ويميز بين اختلاف التناقض واختلاف ألفاظ القراءات.</p>
    <span class="tag fact">نقل موثق عن المصادر الثلاثة</span>
    <hr class="divider">
    <p><b>الاتفاق:</b> التدبر + سلامة القرآن من التناقض. <b>الاختلاف:</b> زاوية العرض فقط، لا التعارض.</p>
  `},
  {id:"hadith", label:"الحديث", title:"سبب النزول", html:`
    <p>لم يثبت من المصادر التي رُوجعت سبب نزول صحيح صريح لهذه الآية.</p>
    <span class="tag fact">لا روايات ضعيفة تُدرج</span>
    <p>توجد أحاديث صحيحة مرتبطة بموضوع «الاختلاف في القرآن» عمومًا (منها ما أخرجه مسلم)، لكنها ليست سبب نزول للآية بعينها.</p>
  `},
  {id:"others", label:"الآخرون", title:"قراءات معاصرة", html:`
    <p class="hint">تفسير كل شخص لهذه الآية بعينها (لا منهجه العام) هو المطلوب هنا. المؤكّد حاليًا: <b>الشعراوي</b> فقط. البقية تُركت فارغة من "ماذا فسّر" — بانتظار مصادر تحدد أين قال كل واحد رأيه في هذه الآية تحديدًا.</p>

    <div class="group-label">مفكرون تأويليون/نقديون معاصرون</div>

    <details><summary>محمد شحرور</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>نصر حامد أبو زيد</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>محمد أركون</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>محمد عابد الجابري</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>فضل الرحمن (Fazlur Rahman)</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>محمد أحمد خلف الله</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>عبد الكريم سروش</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>محمد الطالبي</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>ياشار نوري أوزتورك</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <div class="group-label">لغويون وأصحاب المنهج البياني</div>

    <details><summary>فاضل السامرائي</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>محمد متولي الشعراوي</summary>
      <p><b>تفسيره لهذه الآية تحديدًا (من «خواطر الشعراوي»):</b> يبدأ بأن أسلوب «أفلا» توبيخي، يقرّع من يترك التدبر وهو قادر عليه. يميّز بين التدبر والتفكر والتذكر والتعقل والعلم كمراحل متتالية للعقل.</p>
      <p>يبني استدلاله على أن الاختلاف والتناقض في الكلام يصدر عادة ممن يتغيّر رأيه بتغيّر الحال أو التجربة (كما يتناقض شاعر أنكر البعث ثم أثبته)، أما كلام الله فلا يتغيّر علمه، فلا يقع فيه تناقض.</p>
      <p>ثم يردّ مباشرة على دعاوى «اختلافات» رفعها مستشرقون: أيام خلق الأرض (يوسّع الأربعة أيام بضم اليومين الأولين إليها فلا تعارض مع الستة)، وآية «وما رميت إذ رميت» (يفرّق بين فعل الرمي الشكلي المنسوب للنبي ﷺ وأثره الحقيقي المنسوب لله، فلا تناقض بل اختلاف جهة)، واختلاف القراءات مثل «مالك/ملك يوم الدين» (يراها ترادفًا لا تعارضًا). ويستدل أيضًا بأن كفار قريش أنفسهم، رغم فصاحتهم وعداوتهم، لم يتهموا القرآن بالتناقض.</p>
      <span class="tag fact">تفسير مباشر موثّق للآية — «خواطر الشعراوي»، سورة النساء ٨٢</span>
    </details>

    <details><summary>محمود شاكر</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>عائشة عبد الرحمن (بنت الشاطئ)</summary>
      <p class="hint">تفسيرها لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>أمين الخولي</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>مصطفى صادق الرافعي</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>عبد العظيم المطعني</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>

    <details><summary>تمام حسان</summary>
      <p class="hint">تفسيره لهذه الآية: بانتظار مصدر.</p>
      <span class="tag reading">بانتظار مصدر</span>
    </details>
  `},
  {id:"horizons", label:"آفاق الآية", title:"علمي · عددي · معاصر", html:`
    <p><span class="tag infer">استنباط</span> هل «الاختلاف الكثير» المنفيّ يشمل نوعًا محددًا أم كل اضطراب ظاهري؟</p>
    <p><span class="tag reading">قراءة محتملة</span> أي بحث عددي يتطلب أولًا تحديد المرجع (أي رسم؟ هل تُحسب البسملة؟) قبل مناقشة أي نتيجة.</p>
    <p><span class="tag reflect">تأمل معاصر</span> هل وفرة المعلومات اليوم تُقرّب من التدبر أم تُبعد نحو السطحية؟</p>
  `},
  {id:"mind", label:"ميدان العقل", title:"قبل أن تحكم... اسأل", html:`
    <div class="q">ما المقصود بالاختلاف هنا تحديدًا؟</div>
    <div class="q">هل كل اختلاف ظاهري تناقض؟</div>
    <div class="q">كيف يميّز العقل بين التناقض الحقيقي واختلاف زاوية العرض؟</div>
    <div class="q">هل تدخل اختلافات القراءات في «الاختلاف الكثير»؟</div>
  `},
  {id:"tadabbur", label:"تدبر", title:"ماذا فهمت أنت؟", html:`
    <p>سؤال اليوم: هل قراءتنا اليومية للقرآن تقوم على التدبر أم على التلاوة فقط؟</p>
    <textarea id="reflectionBox" placeholder="اكتب تأملك هنا..."></textarea>
    <br><button class="primary" onclick="saveReflection()">حفظ في دفتر التدبر</button>
    <div id="savedList"></div>
  `}
];

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
sections.forEach((s,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab' + (i===0?' active':'');
  btn.textContent = s.label;
  btn.onclick = ()=>showTab(s.id);
  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i===0?' active':'');
  panel.id = 'panel-'+s.id;
  panel.innerHTML = '<h3>'+s.title+'</h3>'+s.html;
  panelsEl.appendChild(panel);
});

function showTab(id){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active', sections[i].id===id));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
}

document.querySelectorAll('.ayah span').forEach(w=>{
  w.addEventListener('click', ()=>showTab('words'));
});

function loadReflections(){
  try{
    const raw = localStorage.getItem('tadabbur_annisa82');
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function renderReflections(){
  const list = loadReflections();
  const el = document.getElementById('savedList');
  if(!el) return;
  el.innerHTML = list.map(r=>'<div class="saved-note">📅 '+r.date+'<br>'+r.text+'</div>').join('');
}
function saveReflection(){
  const box = document.getElementById('reflectionBox');
  const text = box.value.trim();
  if(!text) return;
  try{
    const list = loadReflections();
    list.unshift({date:new Date().toLocaleDateString('ar-KW'), text});
    localStorage.setItem('tadabbur_annisa82', JSON.stringify(list));
    box.value='';
    renderReflections();
  }catch(e){}
}
renderReflections();
</script>
</body>
</html>
